<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>上传新闻 - 满香日报</title>
    <link rel="stylesheet" href="css/style.css">
    <meta name="description" content="满香日报 - 上传新闻文章">
    <style>
        .upload-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        
        input[type="text"],
        input[type="date"],
        textarea,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }
        
        textarea {
            min-height: 200px;
            resize: vertical;
        }
        
        button {
            background-color: #e74c3c;
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-right: 10px;
        }
        
        button:hover {
            background-color: #c0392b;
        }
        
        .preview-container {
            margin-top: 30px;
            padding: 20px;
            border: 1px dashed #ddd;
            border-radius: 4px;
        }
        
        .preview-container h3 {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .checkbox-group input[type="checkbox"] {
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <!-- GitHub Corner -->
    <a href="https://github.com/NmouzzH0606/simmc-news" class="github-corner" aria-label="View source on GitHub">
        <svg width="80" height="80" viewBox="0 0 250 250" style="fill:#151513; color:#fff; position: absolute; top: 0; border: 0; right: 0;" aria-hidden="true">
            <path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"></path>
            <path d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2" fill="currentColor" style="transform-origin: 130px 106px;" class="octo-arm"></path>
            <path d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z" fill="currentColor" class="octo-body"></path>
        </svg>
    </a>

    <header>
        <div class="container">
            <h1 class="logo">满香日报</h1>
            <p class="tagline">每日新闻，尽在掌握</p>
            <nav>
                <ul>
                    <li><a href="index.html">首页</a></li>
                    <li><a href="upload.html" class="active">上传新闻</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="upload-container">
            <h2>上传新闻文章</h2>
            <p>请填写以下信息，创建一篇新的新闻文章。</p>
            
            <form id="upload-form" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="title">标题</label>
                    <input type="text" id="title" name="title" required>
                </div>
                
                <div class="form-group">
                    <label for="category">分类</label>
                    <select id="category" name="category" required>
                        <option value="公告">公告</option>
                        <option value="本地">本地新闻</option>
                        <option value="国际">国际新闻</option>
                        <option value="科技">科技新闻</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="author">作者</label>
                    <input type="text" id="author" name="author" required>
                </div>
                
                <div class="form-group">
                    <label for="date">发布日期</label>
                    <input type="date" id="date" name="date" required>
                </div>
                
                <div class="form-group">
                    <label for="image">图片URL</label>
                    <input type="text" id="image" name="image" placeholder="https://example.com/image.jpg">
                </div>
                
                <div class="form-group">
                    <label for="excerpt">摘要</label>
                    <textarea id="excerpt" name="excerpt" rows="3"></textarea>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="featured" name="featured">
                    <label for="featured">设为头条新闻</label>
                </div>
                
                <div class="form-group">
                    <label for="content">内容 (Markdown 格式)</label>
                    <textarea id="content" name="content" required></textarea>
                </div>
                
                <div class="form-group">
                    <label for="filename">文件名 (不含扩展名)</label>
                    <input type="text" id="filename" name="filename" required>
                </div>
                
                <button type="button" id="preview-btn">预览</button>
                <button type="submit">上传</button>
                <button type="button" id="reset-btn">重置</button>
            </form>
            
            <div class="preview-container" id="preview" style="display: none;">
                <h3>预览</h3>
                <div id="preview-content"></div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; <script>document.write(new Date().getFullYear())</script> 满香日报 - Simmc News. 保留所有权利。</p>
            <p>使用 <a href="https://github.com/NmouzzH0606/simmc-news" target="_blank" style="color: #fff;">GitHub</a> 查看源代码</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('upload-form');
            const previewBtn = document.getElementById('preview-btn');
            const resetBtn = document.getElementById('reset-btn');
            const previewContainer = document.getElementById('preview');
            const previewContent = document.getElementById('preview-content');
            
            // Generate a random image if none is provided
            document.getElementById('image').addEventListener('blur', function() {
                if (!this.value) {
                    const randomId = Math.floor(Math.random() * 100);
                    this.value = `https://picsum.photos/id/${randomId}/600/400`;
                }
            });
            
            // Set default date to today
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('date').value = today;
            
            // Auto-generate filename from title
            document.getElementById('title').addEventListener('blur', function() {
                const filename = document.getElementById('filename');
                if (this.value && !filename.value) {
                    // Convert title to slug
                    const slug = this.value
                        .toLowerCase()
                        .replace(/[^\w\u4e00-\u9fa5]+/g, '-')
                        .replace(/^-+|-+$/g, '');
                    
                    filename.value = slug;
                }
            });
            
            // Preview button click handler
            previewBtn.addEventListener('click', function() {
                const title = document.getElementById('title').value;
                const category = document.getElementById('category').value;
                const author = document.getElementById('author').value;
                const date = document.getElementById('date').value;
                const image = document.getElementById('image').value;
                const excerpt = document.getElementById('excerpt').value;
                const content = document.getElementById('content').value;
                const featured = document.getElementById('featured').checked;
                
                // Generate Markdown content
                const markdown = `---
title: ${title}
category: ${category}
date: ${date}
author: ${author}
image: ${image}
excerpt: ${excerpt}
featured: ${featured}
---

# ${title}

${content}
`;
                
                // Render the preview
                previewContent.innerHTML = marked.parse(markdown);
                previewContainer.style.display = 'block';
            });
            
            // Reset button click handler
            resetBtn.addEventListener('click', function() {
                form.reset();
                document.getElementById('date').value = today;
                previewContainer.style.display = 'none';
            });
            
            // Form submit handler
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const title = document.getElementById('title').value;
                const category = document.getElementById('category').value;
                const author = document.getElementById('author').value;
                const date = document.getElementById('date').value;
                const image = document.getElementById('image').value;
                const excerpt = document.getElementById('excerpt').value;
                const content = document.getElementById('content').value;
                const featured = document.getElementById('featured').checked;
                const filename = document.getElementById('filename').value;
                
                // Generate Markdown content
                const markdown = `---
title: ${title}
category: ${category}
date: ${date}
author: ${author}
image: ${image}
excerpt: ${excerpt}
featured: ${featured}
---

# ${title}

${content}
`;
                
                // Create a file from the Markdown content
                const file = new File([markdown], `${filename}.md`, { type: 'text/markdown' });
                
                // Create a FormData object
                const formData = new FormData();
                formData.append('newsFile', file);
                
                try {
                    // Upload the file
                    const response = await fetch('/api/news/upload', {
                        method: 'POST',
                        body: formData
                    });
                    
                    if (!response.ok) {
                        throw new Error(`Failed to upload file: ${response.status} ${response.statusText}`);
                    }
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        alert('文件上传成功！');
                        window.location.href = 'index.html';
                    } else {
                        alert(`上传失败: ${result.error}`);
                    }
                } catch (error) {
                    console.error('Error uploading file:', error);
                    alert(`上传失败: ${error.message}`);
                }
            });
        });
    </script>
</body>
</html>
